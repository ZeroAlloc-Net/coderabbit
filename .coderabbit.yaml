# Central CodeRabbit baseline. Applies to every repo in this org that has no
# .coderabbit.yaml of its own. Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US
# Fewer review rounds: one comment per pattern, no new nitpicks on fixes,
# and no silent reversal of an earlier recommendation. Max 250 characters.
tone_instructions: >-
  Name every location of a pattern in one comment. In follow-up reviews, raise
  only new issues in changed lines. If you reverse an earlier recommendation,
  say so and why. Be brief and cite sources.
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  # Approve once all CodeRabbit comments are resolved, request changes while open.
  request_changes_workflow: true
  # Session handoff files (docs/planning/STATE.md) change on every chore(state)
  # PR and hold no code; reviewing them only adds rounds.
  path_filters:
    - "!**/STATE.md"
    # Generated by release-please.
    - "!**/CHANGELOG.md"
  path_instructions:
    - path: "docs/{superpowers/plans,planning,plans}/**"
      instructions: |
        Plans and design records written for AI coding sessions. Review for
        design gaps, contradictions with the code or with other plan steps,
        and steps that cannot work as written. Do not comment on wording,
        style or formatting. Completed plans are historical records: do not
        ask to update them to match later changes.
    - path: "src/**/*.cs"
      instructions: |
        ZeroAlloc libraries target zero allocations on hot paths and Native
        AOT. Flag new allocations on hot paths (closures, boxing, LINQ, params
        arrays, string building) and reflection or dynamic code that breaks
        trimming or AOT. Analyzer and source-generator projects must stay on
        netstandard2.0.
  auto_review:
    enabled: true
    drafts: false
    # Stacked PRs target a feature branch; review those too, not only the
    # default branch.
    base_branches:
      - ".*"
    ignore_usernames:
      - renovate[bot]
      - dependabot[bot]
      - github-actions[bot]
      - release-please[bot]
      # Release PRs come from this app, not from release-please[bot].
      - marcel-release-bot[bot]
knowledge_base:
  code_guidelines:
    # CLAUDE.md and AGENTS.md are read by default; the conventions file the
    # Claude sessions follow is not.
    filePatterns:
      - "**/docs/planning/CONVENTIONS.md"
  learnings:
    # The ZeroAlloc repos share one stack, so a learning taught in one repo
    # applies to all of them.
    scope: global
